<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型三 - 详细展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(160deg, #fffdf5 0%, #fff9e0 30%, #ffecb3 70%, #ffe082 100%);
            min-height: 100vh;
            color: #5a4030;
            overflow: hidden;
        }
        
        .page-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .model-display-section {
            height: calc(100vh * 2 / 3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            perspective: 1200px;
        }
        
        .model-carousel {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .carousel-item {
            position: absolute;
            width: 60%;
            height: 80%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 248, 225, 0.95) 100%);
            border-radius: 25px;
            border: 1px solid rgba(255, 160, 0, 0.2);
            box-shadow: 0 20px 60px rgba(255, 160, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
        }
        
        .carousel-item.active {
            transform: translateX(0) translateZ(0) scale(1);
            opacity: 1;
            z-index: 3;
            border-color: rgba(255, 160, 0, 0.7);
            box-shadow: 0 20px 60px rgba(255, 160, 0, 0.15), 0 0 60px rgba(255, 160, 0, 0.3);
        }
        
        .carousel-item.left {
            transform: translateX(-35%) translateZ(-100px) scale(0.75);
            opacity: 0.4;
            z-index: 2;
            filter: blur(2px);
        }
        
        .carousel-item.right {
            transform: translateX(35%) translateZ(-100px) scale(0.75);
            opacity: 0.4;
            z-index: 2;
            filter: blur(2px);
        }
        
        .carousel-item:hover {
            opacity: 0.6;
        }
        
        .carousel-item.active:hover {
            opacity: 1;
        }
        
        .carousel-item-visual {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, #ffecb3 0%, #ffe082 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8em;
            color: rgba(230, 81, 0, 0.25);
            border: 3px dashed rgba(255, 160, 0, 0.4);
        }
        
        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 4;
        }
        
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 160, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: #ffa000;
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(255, 160, 0, 0.6);
        }
        
        .text-section {
            height: calc(100vh * 1 / 3);
            background: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 160, 0, 0.15);
            padding: 30px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .text-content h2 {
            font-size: 2.2em;
            color: #e65100;
            margin-bottom: 15px;
        }
        
        .text-content p {
            color: #8a7040;
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .arrow-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 160, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
        }
        
        .arrow-nav:hover {
            background: rgba(255, 160, 0, 1);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 160, 0, 0.6);
        }
        
        .arrow-nav.prev {
            left: 30px;
        }
        
        .arrow-nav.next {
            right: 30px;
        }
        
        .arrow {
            border: solid #fff;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 4px;
        }
        
        .left-arrow {
            transform: rotate(135deg);
        }
        
        .right-arrow {
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="model-display-section">
            <div class="model-carousel" id="modelCarousel">
                <div class="arrow-nav prev" onclick="previousModel()">
                    <i class="arrow left-arrow"></i>
                </div>
                <div class="arrow-nav next" onclick="nextModel()">
                    <i class="arrow right-arrow"></i>
                </div>
                
                <div class="carousel-item active" data-index="0">
                    <div class="carousel-item-visual">3A</div>
                </div>
                <div class="carousel-item left" data-index="1">
                    <div class="carousel-item-visual">3B</div>
                </div>
                <div class="carousel-item right" data-index="2">
                    <div class="carousel-item-visual">3C</div>
                </div>
                
                <div class="indicators">
                    <div class="indicator active" data-index="0" onclick="goToModel(0)"></div>
                    <div class="indicator" data-index="1" onclick="goToModel(1)"></div>
                    <div class="indicator" data-index="2" onclick="goToModel(2)"></div>
                </div>
            </div>
        </div>
        
        <div class="text-section">
            <div class="text-content" id="textContent">
                <h2 id="modelTitle">模型三 - A版本</h2>
                <p id="modelDescription">这是模型三的第一个子模型，专注于数据分析和可视化领域。该版本集成了丰富的图表组件和交互式仪表盘，能够将复杂数据转化为直观的可视化展示，帮助用户快速洞察数据趋势。</p>
                <p>支持多种数据源接入，包括数据库、API接口和本地文件，灵活适配各类数据环境。</p>
            </div>
        </div>
    </div>

    <script>
        const modelsData = [
            {
                title: "模型三 - A版本",
                description: "这是模型三的第一个子模型，专注于数据分析和可视化领域。该版本集成了丰富的图表组件和交互式仪表盘，能够将复杂数据转化为直观的可视化展示，帮助用户快速洞察数据趋势。",
                extra: "支持多种数据源接入，包括数据库、API接口和本地文件，灵活适配各类数据环境。"
            },
            {
                title: "模型三 - B版本",
                description: "这是模型三的第二个子模型，在A版本的基础上增加了高级统计分析功能。支持回归分析、聚类分析、时间序列预测等多种统计方法，为数据驱动决策提供科学依据。",
                extra: "内置自动化报告生成功能，可将分析结果一键导出为专业的PDF或HTML报告，方便团队协作和分享。"
            },
            {
                title: "模型三 - C版本",
                description: "这是模型三的第三个子模型，引入了AI辅助分析引擎。通过自然语言交互，用户可以直接用中文描述分析需求，系统自动生成对应的分析流程和可视化结果，大幅降低使用门槛。",
                extra: "支持智能异常检测和自动洞察发现，主动识别数据中的关键模式和异常点，提升分析效率。"
            }
        ];
        
        let currentIndex = 0;
        let isAnimating = false;
        
        function updateCarousel() {
            const items = document.querySelectorAll('.carousel-item');
            const indicators = document.querySelectorAll('.indicator');
            
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.className = 'carousel-item active';
                } else if (index === (currentIndex - 1 + 3) % 3) {
                    item.className = 'carousel-item left';
                } else if (index === (currentIndex + 1) % 3) {
                    item.className = 'carousel-item right';
                } else {
                    item.className = 'carousel-item left';
                }
            });
            
            indicators.forEach((indicator, index) => {
                if (index === currentIndex) {
                    indicator.className = 'indicator active';
                } else {
                    indicator.className = 'indicator';
                }
            });
            
            const data = modelsData[currentIndex];
            document.getElementById('modelTitle').textContent = data.title;
            document.getElementById('modelDescription').textContent = data.description;
            document.querySelector('#textContent p:last-child').textContent = data.extra;
        }
        
        function nextModel() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex = (currentIndex + 1) % 3;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        function previousModel() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex = (currentIndex - 1 + 3) % 3;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        function goToModel(index) {
            if (isAnimating || index === currentIndex) return;
            isAnimating = true;
            currentIndex = index;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        document.querySelectorAll('.carousel-item').forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.dataset.index);
                if (index !== currentIndex) {
                    goToModel(index);
                }
            });
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousModel();
            if (e.key === 'ArrowRight') nextModel();
        });
    </script>
</body>
</html>
