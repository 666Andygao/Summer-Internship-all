<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>制作流程 - 模型三</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-kai), var(--font-song), serif;
            background: linear-gradient(160deg, #f6efdf 0%, #ece0c8 30%, #e2d4b6 70%, #d3c29c 100%);
            min-height: 100vh;
            color: #3a3226;
            overflow: hidden;
            display: flex;
            align-items: stretch;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(255, 253, 247, 0.95);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(160, 136, 104, 0.25);
            box-shadow: 0 4px 20px rgba(62, 39, 35, 0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: linear-gradient(135deg, #a08868 0%, #5d4037 100%);
            color: #f6efdf;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.88em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(93, 64, 55, 0.3);
            letter-spacing: 0.5px;
        }

        .nav-back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(93, 64, 55, 0.45);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: transparent;
            color: #5d4037;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.92em;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid rgba(160, 136, 104, 0.3);
            letter-spacing: 0.5px;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #c4b59a 0%, #8d6e63 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(93, 64, 55, 0.35);
        }

        .nav-tab:not(.active):hover {
            background: rgba(160, 136, 104, 0.1);
            border-color: rgba(141, 110, 99, 0.5);
            transform: translateY(-1px);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fullscreen-toggle {
            width: 40px;
            height: 40px;
            border: none;
            background: linear-gradient(135deg, #f1e8d8 0%, #d8cdb8 100%);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.15em;
            color: #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(93, 64, 55, 0.15);
        }

        .fullscreen-toggle:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #d8cdb8 0%, #c4b59a 100%);
            box-shadow: 0 4px 14px rgba(93, 64, 55, 0.3);
        }

        .image-panel {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(2% + 64px) 2% 2%;
            position: relative;
            min-width: 0;
        }

        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 253, 247, 0.92);
            border-radius: 8px;
            border: 2px solid #a08868;
            box-shadow: 0 4px 24px rgba(62, 39, 35, 0.12), inset 0 0 60px rgba(160, 136, 104, 0.06);
            backdrop-filter: blur(8px);
            overflow: hidden;
            position: relative;
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(93, 64, 55, 0.25);
            transition: opacity 0.3s ease;
        }

        .image-placeholder .icon {
            font-size: 5em;
            line-height: 1;
        }

        .image-placeholder .text {
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .process-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .process-image.visible {
            opacity: 1;
        }

        .step-label {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(93, 64, 55, 0.06);
            color: #5d4037;
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 2px;
            border: 1px solid rgba(93, 64, 55, 0.15);
            transition: all 0.4s ease;
            z-index: 5;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            padding: 8px 18px;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            color: #f6efdf;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(62, 39, 35, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(62, 39, 35, 0.45);
        }

        .tree-panel {
            flex: 1;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(255, 253, 247, 0.85);
            border-left: 2px solid #a08868;
            box-shadow: -2px 0 20px rgba(62, 39, 35, 0.06);
            overflow: hidden;
            min-width: 260px;
            position: relative;
        }

        .toc-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }

        .toc-view.hidden {
            display: none;
        }

        .toc-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid rgba(160, 136, 104, 0.25);
            text-align: center;
            flex-shrink: 0;
        }

        .toc-header .toc-icon {
            font-size: 2em;
            line-height: 1;
            margin-bottom: 4px;
            opacity: 0.6;
        }

        .toc-header .toc-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #3a3226;
            letter-spacing: 3px;
        }

        .toc-header .toc-subtitle {
            font-size: 0.7em;
            color: #8d6e63;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .toc-list::-webkit-scrollbar {
            width: 4px;
        }

        .toc-list::-webkit-scrollbar-thumb {
            background: rgba(160, 136, 104, 0.3);
            border-radius: 2px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(160, 136, 104, 0.1);
            position: relative;
            gap: 14px;
        }

        .toc-item:hover {
            background: rgba(160, 136, 104, 0.08);
        }

        .toc-item:last-child {
            border-bottom: none;
        }

        .toc-item .toc-num {
            width: 32px;
            height: 32px;
            border-radius: 2px;
            background: rgba(160, 136, 104, 0.12);
            color: #8d6e63;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: 700;
            flex-shrink: 0;
            border: 1px solid rgba(160, 136, 104, 0.2);
            transition: all 0.3s ease;
        }

        .toc-item:hover .toc-num {
            background: #5d4037;
            color: #f6efdf;
            border-color: #5d4037;
        }

        .toc-item .toc-name {
            font-size: 0.95em;
            color: #5d4037;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .toc-item:hover .toc-name {
            color: #3a3226;
        }

        .toc-item .toc-arrow {
            margin-left: auto;
            color: #a08868;
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .toc-item:hover .toc-arrow {
            transform: translateX(4px);
            color: #5d4037;
        }

        .detail-view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 0;
        }

        .detail-view.visible {
            display: flex;
        }

        .detail-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            color: #8d6e63;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            border-bottom: 1px solid rgba(160, 136, 104, 0.15);
            flex-shrink: 0;
            user-select: none;
        }

        .detail-back:hover {
            color: #3a3226;
            background: rgba(160, 136, 104, 0.06);
        }

        .detail-back .back-arrow {
            font-size: 1.1em;
            transition: transform 0.25s ease;
        }

        .detail-back:hover .back-arrow {
            transform: translateX(-3px);
        }

        .detail-body {
            flex: 1;
            overflow-y: hidden;
            overflow-x: auto;
            padding: 28px 18px;
            writing-mode: vertical-rl;
            font-family: var(--font-kai), var(--font-song), serif;
        }

        .detail-body::-webkit-scrollbar {
            height: 6px;
        }

        .detail-body::-webkit-scrollbar-track {
            background: rgba(160, 136, 104, 0.12);
            border-radius: 3px;
        }

        .detail-body::-webkit-scrollbar-thumb {
            background: rgba(120, 80, 40, 0.35);
            border-radius: 3px;
        }

        .detail-step-num {
            font-size: 1.1em;
            color: #9c5a34;
            letter-spacing: 4px;
            margin-left: 16px;
            padding: 4px 8px;
            background: rgba(139, 90, 43, 0.06);
            border: 1px solid rgba(139, 90, 43, 0.15);
        }

        .detail-title {
            font-size: 2.0em;
            font-weight: 700;
            color: #3a3226;
            letter-spacing: 6px;
            line-height: 1.6;
            margin-left: 22px;
            padding-left: 16px;
            border-left: 3px solid rgba(139, 90, 43, 0.3);
        }

        .detail-subtitle {
            font-size: 1.0em;
            color: #9c5a34;
            letter-spacing: 3px;
            margin-left: 22px;
            padding-left: 16px;
            border-left: 3px solid rgba(139, 90, 43, 0.18);
            font-style: italic;
        }

        .detail-desc {
            font-size: 1.35em;
            color: #4a3020;
            line-height: 2.8;
            letter-spacing: 2px;
            margin-left: 20px;
        }

        .detail-desc p {
            margin: 0;
            text-indent: 0;
        }

        .detail-nav {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid rgba(160, 136, 104, 0.2);
            flex-shrink: 0;
            gap: 10px;
        }

        .detail-nav-btn {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            background: rgba(160, 136, 104, 0.08);
            border: 1px solid rgba(160, 136, 104, 0.2);
            color: #5d4037;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            font-family: var(--font-kai), var(--font-song), serif;
            user-select: none;
        }

        .detail-nav-btn:hover {
            background: #5d4037;
            color: #f6efdf;
            border-color: #5d4037;
        }

        .detail-nav-btn:active {
            transform: scale(0.97);
        }

        .fullscreen-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            padding: 8px 18px;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            color: #f6efdf;
            border: none;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(62, 39, 35, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            font-family: var(--font-kai), var(--font-song), serif;
        }

        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(62, 39, 35, 0.45);
        }

        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-overlay.visible {
            display: flex;
        }

        .fullscreen-close {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 10000;
            width: 48px;
            height: 48px;
            background: rgba(255, 253, 247, 0.12);
            border: 1px solid rgba(255, 253, 247, 0.25);
            border-radius: 50%;
            color: #fff;
            font-size: 1.4em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .fullscreen-close:hover {
            background: rgba(255, 253, 247, 0.25);
            transform: rotate(90deg);
        }

        .fullscreen-image {
            max-width: 92vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .fullscreen-image.visible {
            opacity: 1;
        }

        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            background: rgba(255, 253, 247, 0.1);
            border: 1px solid rgba(255, 253, 247, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 1.3em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        .fullscreen-nav:hover {
            background: rgba(255, 253, 247, 0.22);
        }

        .fullscreen-nav.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        .fullscreen-prev {
            left: 32px;
        }

        .fullscreen-next {
            right: 32px;
        }

        .fullscreen-label {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 253, 247, 0.7);
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 3px;
            z-index: 10000;
        }

        .detail-nav-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }

            .image-panel {
                flex: 3;
                padding: 2%;
            }

            .tree-panel {
                flex: none;
                height: auto;
                max-height: 45vh;
                min-width: 0;
                border-left: none;
                border-top: 2px solid #a08868;
                box-shadow: 0 -2px 20px rgba(62, 39, 35, 0.06);
            }

            .toc-list {
                max-height: 40vh;
            }

            .detail-body {
                max-height: 35vh;
                overflow-y: hidden;
                overflow-x: auto;
            }
        }
    </style>
  <link rel="stylesheet" href="theme/gufeng.css">
</head>
<body>

    </div>

    <script>
        (function() {
            var tocView = document.getElementById('tocView');
            var detailView = document.getElementById('detailView');
            var tocItems = document.querySelectorAll('.toc-item');
            var detailBack = document.getElementById('detailBack');
            var prevBtn = document.getElementById('prevBtn');
            var nextBtn = document.getElementById('nextBtn');
            var stepLabel = document.getElementById('stepLabel');
            var processImage = document.getElementById('processImage');
            var imagePlaceholder = document.getElementById('imagePlaceholder');
            var detailTitle = document.getElementById('detailTitle');
            var detailSubtitle = document.getElementById('detailSubtitle');
            var detailDesc = document.getElementById('detailDesc');
            var detailStepNum = document.getElementById('detailStepNum');
            var currentIndex = 0;
            var isAnimating = false;

            var chineseNums = ['壹', '贰', '叁', '肆', '伍', '陆'];

            var steps = [
                {
                    name: '合泥',
                    file: '模型三图片/合泥.png',
                    fullscreenFile: '模型三全屏展示/合泥.png',
                    subtitle: '揉捏之间，泥中有灵',
                    desc: '匠人将选好的泥料反复揉捏捶打，去除泥中的气泡与杂质，使泥质均匀细腻。双手在泥中穿梭，力道轻重交替，泥团在掌心之间变得柔软而富有韧性，如获新生。'
                },
                {
                    name: '塑身',
                    file: '模型三图片/塑身.png',
                    fullscreenFile: '模型三全屏展示/塑身.png',
                    subtitle: '指尖流转，雏形初现',
                    desc: '匠人以泥团为基，双手轻拢慢捻，从躯干到四肢，泥在指尖下渐渐成形。每一道弧线都是对形体的揣摩，每一处转折都是对比例的推敲。泥塑的身躯虽未完成，却已隐约透出生命的气息。'
                },
                {
                    name: '塑头',
                    file: '模型三图片/塑头.png',
                    fullscreenFile: '模型三全屏展示/塑头.png',
                    subtitle: '眉眼之间，神韵天成',
                    desc: '头部是泥塑的灵魂所在。匠人另取泥团，精心塑造五官——眉弓的弧度、鼻梁的走势、嘴角的微扬，皆需屏息凝神、一丝不苟。塑头不仅是对形态的刻画，更是对神韵的捕捉，眉眼之间，仿佛能听见泥塑的低语。'
                },
                {
                    name: '合坯与修坯',
                    file: '模型三图片/合坯与修坯.png',
                    fullscreenFile: '模型三全屏展示/合坯与修坯.png',
                    subtitle: '合二为一，精雕细琢',
                    desc: '将塑好的头部与身躯合为一体，接口处需精心粘合，不留痕迹。随后以修坯刀细细修整全身，刮去毛刺与不平之处，使泥塑表面光滑圆润。合坯是联结，修坯是打磨，二者相辅相成，使泥塑浑然一体。'
                },
                {
                    name: '晾晒',
                    file: '模型三图片/晾晒.png',
                    fullscreenFile: '模型三全屏展示/晾晒.png',
                    subtitle: '日暖风轻，静待干燥',
                    desc: '修整完毕的泥塑需在阴凉通风处自然晾干。阳光不可暴晒，风不可过急，一切需顺其自然。匠人时常查看，防裂防变，耐心等待泥中的水分缓缓散去，泥塑在时光中逐渐坚硬。'
                },
                {
                    name: '烧制',
                    file: '模型三图片/烧制.png',
                    fullscreenFile: '模型三全屏展示/烧制.png',
                    subtitle: '烈火淬炼，浴火而生',
                    desc: '晾干的泥塑被送入窑中，烈火是最后的考验。窑温缓缓攀升，火焰在窑中翻涌，泥塑在高温中经历蜕变。待到火熄窑冷，打开窑门，泥塑已脱胎换骨——色泽温润，质地坚实，一件凝聚了匠人心血的作品，在烈火中获得了永恒的生命。'
                }
            ];

            function loadImage(index) {
                processImage.classList.remove('visible');
                if (imagePlaceholder) {
                    imagePlaceholder.style.display = 'flex';
                }

                var img = new Image();
                img.onload = function() {
                    processImage.src = steps[index].file;
                    if (imagePlaceholder) {
                        imagePlaceholder.style.display = 'none';
                    }
                    processImage.classList.add('visible');
                };
                img.onerror = function() {
                    processImage.classList.remove('visible');
                    if (imagePlaceholder) {
                        imagePlaceholder.style.display = 'flex';
                    }
                };
                img.src = steps[index].file;
            }

            function showDetail(index) {
                if (isAnimating) return;
                isAnimating = true;

                currentIndex = index;

                stepLabel.textContent = steps[index].name;
                detailTitle.textContent = steps[index].name;
                detailSubtitle.textContent = steps[index].subtitle || '';
                detailDesc.innerHTML = steps[index].desc;
                detailStepNum.textContent = '第' + chineseNums[index] + '步';

                updateNavButtons();

                tocView.classList.add('hidden');
                detailView.classList.add('visible');

                loadImage(index);

                setTimeout(function() {
                    isAnimating = false;
                }, 450);
            }

            function showToc() {
                if (isAnimating) return;
                isAnimating = true;

                detailView.classList.remove('visible');
                tocView.classList.remove('hidden');

                setTimeout(function() {
                    isAnimating = false;
                }, 450);
            }

            function updateNavButtons() {
                if (currentIndex <= 0) {
                    prevBtn.classList.add('disabled');
                } else {
                    prevBtn.classList.remove('disabled');
                }
                if (currentIndex >= steps.length - 1) {
                    nextBtn.classList.add('disabled');
                } else {
                    nextBtn.classList.remove('disabled');
                }
            }

            function goToPrev() {
                if (currentIndex > 0 && !isAnimating) {
                    showDetail(currentIndex - 1);
                }
            }

            function goToNext() {
                if (currentIndex < steps.length - 1 && !isAnimating) {
                    showDetail(currentIndex + 1);
                }
            }

            for (var i = 0; i < tocItems.length; i++) {
                (function(idx) {
                    tocItems[idx].addEventListener('click', function() {
                        showDetail(idx);
                    });
                })(i);
            }

            detailBack.addEventListener('click', showToc);
            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    goToPrev();
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    goToNext();
                } else if (e.key === 'Escape') {
                    if (detailView.classList.contains('visible')) {
                        showToc();
                    } else if (fullscreenOverlay.classList.contains('visible')) {
                        closeFullscreen();
                    }
                }
            });

            var fullscreenOverlay = document.getElementById('fullscreenOverlay');
            var fullscreenImage = document.getElementById('fullscreenImage');
            var fullscreenLabel = document.getElementById('fullscreenLabel');
            var fullscreenBtn = document.getElementById('fullscreenBtn');
            var fullscreenClose = document.getElementById('fullscreenClose');
            var fullscreenPrev = document.getElementById('fullscreenPrev');
            var fullscreenNext = document.getElementById('fullscreenNext');
            var fullscreenCurrentIndex = 0;

            function openFullscreen(index) {
                fullscreenCurrentIndex = index !== undefined ? index : currentIndex;
                fullscreenLabel.textContent = steps[fullscreenCurrentIndex].name;
                fullscreenImage.classList.remove('visible');

                var img = new Image();
                img.onload = function() {
                    fullscreenImage.src = steps[fullscreenCurrentIndex].fullscreenFile || steps[fullscreenCurrentIndex].file;
                    fullscreenImage.classList.add('visible');
                };
                img.onerror = function() {
                    fullscreenImage.src = steps[fullscreenCurrentIndex].file;
                    fullscreenImage.classList.add('visible');
                };
                img.src = steps[fullscreenCurrentIndex].fullscreenFile || steps[fullscreenCurrentIndex].file;

                fullscreenOverlay.classList.add('visible');
                updateFullscreenNav();
            }

            function closeFullscreen() {
                fullscreenOverlay.classList.remove('visible');
            }

            function updateFullscreenNav() {
                if (fullscreenCurrentIndex <= 0) {
                    fullscreenPrev.classList.add('disabled');
                } else {
                    fullscreenPrev.classList.remove('disabled');
                }
                if (fullscreenCurrentIndex >= steps.length - 1) {
                    fullscreenNext.classList.add('disabled');
                } else {
                    fullscreenNext.classList.remove('disabled');
                }
            }

            function fullscreenGoPrev() {
                if (fullscreenCurrentIndex > 0) {
                    openFullscreen(fullscreenCurrentIndex - 1);
                }
            }

            function fullscreenGoNext() {
                if (fullscreenCurrentIndex < steps.length - 1) {
                    openFullscreen(fullscreenCurrentIndex + 1);
                }
            }

            fullscreenBtn.addEventListener('click', function() {
                openFullscreen(currentIndex);
            });

            var fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
            if (fullscreenToggleBtn) {
                fullscreenToggleBtn.addEventListener('click', function() {
                    openFullscreen(currentIndex);
                });
            }

            fullscreenClose.addEventListener('click', closeFullscreen);
            fullscreenPrev.addEventListener('click', fullscreenGoPrev);
            fullscreenNext.addEventListener('click', fullscreenGoNext);

            fullscreenOverlay.addEventListener('click', function(e) {
                if (e.target === fullscreenOverlay) {
                    closeFullscreen();
                }
            });

            loadImage(0);
        })();
    </script>
</body>
</html>
