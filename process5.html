<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>制作流程 - 模型五</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-kai), var(--font-song), serif;
            background: linear-gradient(160deg, #f6efdf 0%, #ece0c8 30%, #e2d4b6 70%, #d3c29c 100%);
            min-height: 100vh;
            color: #3a3226;
            overflow: hidden;
            display: flex;
            align-items: stretch;
        }

        .image-panel {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2%;
            position: relative;
            min-width: 0;
        }

        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 253, 247, 0.92);
            border-radius: 8px;
            border: 2px solid #a08868;
            box-shadow: 0 4px 24px rgba(62, 39, 35, 0.12), inset 0 0 60px rgba(160, 136, 104, 0.06);
            backdrop-filter: blur(8px);
            overflow: hidden;
            position: relative;
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(93, 64, 55, 0.25);
            transition: opacity 0.3s ease;
        }

        .image-placeholder .icon {
            font-size: 5em;
            line-height: 1;
        }

        .image-placeholder .text {
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .process-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .process-image.visible {
            opacity: 1;
        }

        .step-label {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(93, 64, 55, 0.06);
            color: #5d4037;
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 2px;
            border: 1px solid rgba(93, 64, 55, 0.15);
            transition: all 0.4s ease;
            z-index: 5;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            padding: 8px 18px;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            color: #f6efdf;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(62, 39, 35, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(62, 39, 35, 0.45);
        }

        .tree-panel {
            flex: 1;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(255, 253, 247, 0.85);
            border-left: 2px solid #a08868;
            box-shadow: -2px 0 20px rgba(62, 39, 35, 0.06);
            overflow: hidden;
            min-width: 260px;
            position: relative;
        }

        .toc-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }

        .toc-view.hidden {
            display: none;
        }

        .toc-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid rgba(160, 136, 104, 0.25);
            text-align: center;
            flex-shrink: 0;
        }

        .toc-header .toc-icon {
            font-size: 2em;
            line-height: 1;
            margin-bottom: 4px;
            opacity: 0.6;
        }

        .toc-header .toc-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #3a3226;
            letter-spacing: 3px;
        }

        .toc-header .toc-subtitle {
            font-size: 0.7em;
            color: #8d6e63;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .toc-list::-webkit-scrollbar {
            width: 4px;
        }

        .toc-list::-webkit-scrollbar-thumb {
            background: rgba(160, 136, 104, 0.3);
            border-radius: 2px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(160, 136, 104, 0.1);
            position: relative;
            gap: 14px;
        }

        .toc-item:hover {
            background: rgba(160, 136, 104, 0.08);
        }

        .toc-item:last-child {
            border-bottom: none;
        }

        .toc-item .toc-num {
            width: 32px;
            height: 32px;
            border-radius: 2px;
            background: rgba(160, 136, 104, 0.12);
            color: #8d6e63;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: 700;
            flex-shrink: 0;
            border: 1px solid rgba(160, 136, 104, 0.2);
            transition: all 0.3s ease;
        }

        .toc-item:hover .toc-num {
            background: #5d4037;
            color: #f6efdf;
            border-color: #5d4037;
        }

        .toc-item .toc-name {
            font-size: 0.95em;
            color: #5d4037;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .toc-item:hover .toc-name {
            color: #3a3226;
        }

        .toc-item .toc-arrow {
            margin-left: auto;
            color: #a08868;
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .toc-item:hover .toc-arrow {
            transform: translateX(4px);
            color: #5d4037;
        }

        .detail-view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 0;
        }

        .detail-view.visible {
            display: flex;
        }

        .detail-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            color: #8d6e63;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            border-bottom: 1px solid rgba(160, 136, 104, 0.15);
            flex-shrink: 0;
            user-select: none;
        }

        .detail-back:hover {
            color: #3a3226;
            background: rgba(160, 136, 104, 0.06);
        }

        .detail-back .back-arrow {
            font-size: 1.1em;
            transition: transform 0.25s ease;
        }

        .detail-back:hover .back-arrow {
            transform: translateX(-3px);
        }

        .detail-body {
            flex: 1;
            overflow-y: hidden;
            overflow-x: auto;
            padding: 28px 18px;
            writing-mode: vertical-rl;
            font-family: var(--font-kai), var(--font-song), serif;
        }

        .detail-body::-webkit-scrollbar {
            height: 6px;
        }

        .detail-body::-webkit-scrollbar-track {
            background: rgba(160, 136, 104, 0.12);
            border-radius: 3px;
        }

        .detail-body::-webkit-scrollbar-thumb {
            background: rgba(120, 80, 40, 0.35);
            border-radius: 3px;
        }

        .detail-step-num {
            font-size: 1.1em;
            color: #9c5a34;
            letter-spacing: 4px;
            margin-left: 16px;
            padding: 4px 8px;
            background: rgba(139, 90, 43, 0.06);
            border: 1px solid rgba(139, 90, 43, 0.15);
        }

        .detail-title {
            font-size: 2.0em;
            font-weight: 700;
            color: #3a3226;
            letter-spacing: 6px;
            line-height: 1.6;
            margin-left: 22px;
            padding-left: 16px;
            border-left: 3px solid rgba(139, 90, 43, 0.3);
        }

        .detail-subtitle {
            font-size: 1.0em;
            color: #9c5a34;
            letter-spacing: 3px;
            margin-left: 22px;
            padding-left: 16px;
            border-left: 3px solid rgba(139, 90, 43, 0.18);
            font-style: italic;
        }

        .detail-desc {
            font-size: 1.35em;
            color: #4a3020;
            line-height: 2.8;
            letter-spacing: 2px;
            margin-left: 20px;
        }

        .detail-desc p {
            margin: 0;
            text-indent: 0;
        }

        .detail-nav {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid rgba(160, 136, 104, 0.2);
            flex-shrink: 0;
            gap: 10px;
        }

        .detail-nav-btn {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            background: rgba(160, 136, 104, 0.08);
            border: 1px solid rgba(160, 136, 104, 0.2);
            color: #5d4037;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            font-family: var(--font-kai), var(--font-song), serif;
            user-select: none;
        }

        .detail-nav-btn:hover {
            background: #5d4037;
            color: #f6efdf;
            border-color: #5d4037;
        }

        .detail-nav-btn:active {
            transform: scale(0.97);
        }

        .fullscreen-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            padding: 8px 18px;
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
            color: #f6efdf;
            border: none;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(62, 39, 35, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            font-family: var(--font-kai), var(--font-song), serif;
        }

        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(62, 39, 35, 0.45);
        }

        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-overlay.visible {
            display: flex;
        }

        .fullscreen-close {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 10000;
            width: 48px;
            height: 48px;
            background: rgba(255, 253, 247, 0.12);
            border: 1px solid rgba(255, 253, 247, 0.25);
            border-radius: 50%;
            color: #fff;
            font-size: 1.4em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .fullscreen-close:hover {
            background: rgba(255, 253, 247, 0.25);
            transform: rotate(90deg);
        }

        .fullscreen-image {
            max-width: 92vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .fullscreen-image.visible {
            opacity: 1;
        }

        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            background: rgba(255, 253, 247, 0.1);
            border: 1px solid rgba(255, 253, 247, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 1.3em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        .fullscreen-nav:hover {
            background: rgba(255, 253, 247, 0.22);
        }

        .fullscreen-nav.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        .fullscreen-prev {
            left: 32px;
        }

        .fullscreen-next {
            right: 32px;
        }

        .fullscreen-label {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 253, 247, 0.7);
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 3px;
            z-index: 10000;
        }

        .detail-nav-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }

            .image-panel {
                flex: 3;
                padding: 2%;
            }

            .tree-panel {
                flex: none;
                height: auto;
                max-height: 45vh;
                min-width: 0;
                border-left: none;
                border-top: 2px solid #a08868;
                box-shadow: 0 -2px 20px rgba(62, 39, 35, 0.06);
            }

            .toc-list {
                max-height: 40vh;
            }

            .detail-body {
                max-height: 35vh;
                overflow-y: hidden;
                overflow-x: auto;
            }
        }
    </style>
  <link rel="stylesheet" href="theme/gufeng.css">
</head>
<body>
    <div class="image-panel" id="imagePanel">
        <a class="back-link" href="model.html" title="返回模型展示中心">&#9664; 返回</a>
        <button class="fullscreen-btn" id="fullscreenBtn" title="全屏查看">&#9974; 全屏</button>
        <div class="image-container" id="imageContainer">
            <div class="image-placeholder" id="imagePlaceholder">
                <span class="icon">&#9874;</span>
            </div>
            <img class="process-image" id="processImage" src="" alt="制作流程">
            <div class="step-label" id="stepLabel">采火草</div>
        </div>
    </div>

    <div class="tree-panel">
        <div class="toc-view" id="tocView">
            <div class="toc-header">
                <div class="toc-icon">&#128218;</div>
                <div class="toc-title">制 作 流 程</div>
                <div class="toc-subtitle">PROCESS</div>
            </div>
            <div class="toc-list" id="tocList">
                <div class="toc-item" data-index="0">
                    <span class="toc-num">壹</span>
                    <span class="toc-name">采火草</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="1">
                    <span class="toc-num">贰</span>
                    <span class="toc-name">撕绒捻线</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="2">
                    <span class="toc-num">叁</span>
                    <span class="toc-name">剥麻</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="3">
                    <span class="toc-num">肆</span>
                    <span class="toc-name">煮麻</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="4">
                    <span class="toc-num">伍</span>
                    <span class="toc-name">排线上机</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="5">
                    <span class="toc-num">陆</span>
                    <span class="toc-name">纺织</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
                <div class="toc-item" data-index="6">
                    <span class="toc-num">柒</span>
                    <span class="toc-name">成布</span>
                    <span class="toc-arrow">&#9654;</span>
                </div>
            </div>
        </div>

        <div class="detail-view" id="detailView">
            <div class="detail-back" id="detailBack">
                <span class="back-arrow">&#9664;</span> 返回目录
            </div>
            <div class="detail-body">
                <span class="detail-step-num" id="detailStepNum">第壹步</span>
                <div class="detail-title" id="detailTitle">采火草</div>
                <div class="detail-subtitle" id="detailSubtitle">踏遍山野，寻草为线</div>
                <div class="detail-desc" id="detailDesc">匠人背篓上山，在晨露未干之时寻找火草。火草生于山野，叶片狭长，背面覆有一层银白色的绒状纤维。匠人俯身采摘，需挑选成熟饱满的叶片。采火草讲究时节，过早则纤维未成，过晚则叶片枯老，唯有恰到好处，方能取到最好的绒料。这是纺织之旅的起点，每一片火草都承载着匠人对自然的敬畏与对技艺的虔诚。</div>
            </div>
            <div class="detail-nav">
                <button class="detail-nav-btn" id="prevBtn">&#9664; 上一步</button>
                <button class="detail-nav-btn" id="nextBtn">下一步 &#9654;</button>
            </div>
        </div>
    </div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="fullscreen-close" id="fullscreenClose" title="关闭全屏">&#10005;</button>
        <img class="fullscreen-image" id="fullscreenImage" src="" alt="全屏展示">
        <button class="fullscreen-nav fullscreen-prev" id="fullscreenPrev" title="上一张">&#9664;</button>
        <button class="fullscreen-nav fullscreen-next" id="fullscreenNext" title="下一张">&#9654;</button>
        <div class="fullscreen-label" id="fullscreenLabel"></div>
    </div>

    <script>
        (function() {
            var tocView = document.getElementById('tocView');
            var detailView = document.getElementById('detailView');
            var tocItems = document.querySelectorAll('.toc-item');
            var detailBack = document.getElementById('detailBack');
            var prevBtn = document.getElementById('prevBtn');
            var nextBtn = document.getElementById('nextBtn');
            var stepLabel = document.getElementById('stepLabel');
            var processImage = document.getElementById('processImage');
            var imagePlaceholder = document.getElementById('imagePlaceholder');
            var detailTitle = document.getElementById('detailTitle');
            var detailSubtitle = document.getElementById('detailSubtitle');
            var detailDesc = document.getElementById('detailDesc');
            var detailStepNum = document.getElementById('detailStepNum');
            var currentIndex = 0;
            var isAnimating = false;

            var chineseNums = ['壹', '贰', '叁', '肆', '伍', '陆', '柒'];

            var steps = [
                {
                    name: '采火草',
                    file: '模型五图片/采火草.png',
                    fullscreenFile: '模型五全屏展示/采火草.png',
                    subtitle: '踏遍山野，寻草为线',
                    desc: '匠人背篓上山，在晨露未干之时寻找火草。火草生于山野，叶片狭长，背面覆有一层银白色的绒状纤维。匠人俯身采摘，需挑选成熟饱满的叶片。采火草讲究时节，过早则纤维未成，过晚则叶片枯老，唯有恰到好处，方能取到最好的绒料。这是纺织之旅的起点，每一片火草都承载着匠人对自然的敬畏与对技艺的虔诚。'
                },
                {
                    name: '撕绒捻线',
                    file: '模型五图片/撕绒捻线.png',
                    fullscreenFile: '模型五全屏展示/撕绒捻线.png',
                    subtitle: '轻捻慢搓，绒线初成',
                    desc: '采回的火草叶片需趁鲜处理。匠人小心地将叶片背面的绒状纤维撕下，一缕一缕地收集起来。这些细如蛛丝的绒纤维，在匠人的指尖被轻轻捻搓，渐渐聚拢成线。撕绒捻线是极细致的活计，需耐心与巧手兼备，稍有不慎便会扯断纤维。捻成的绒线虽细，却韧性十足，是火草布最珍贵的原料。'
                },
                {
                    name: '剥麻',
                    file: '模型五图片/剥麻.png',
                    fullscreenFile: '模型五全屏展示/剥麻.png',
                    subtitle: '剥麻取筋，韧线为骨',
                    desc: '麻是火草布的骨架。匠人将收割的麻秆浸泡后，从茎皮中剥出一条条坚韧的麻纤维。剥麻需顺着纹理，力道均匀，剥出的麻线才粗细一致。剥好的麻线在阳光下晾晒，色泽由青转白，质地由柔变韧，成为织布时不可或缺的经线。'
                },
                {
                    name: '煮麻',
                    file: '模型五图片/煮麻.png',
                    fullscreenFile: '模型五全屏展示/煮麻.png',
                    subtitle: '沸水煮炼，去芜存菁',
                    desc: '剥好的麻线尚带有植物胶质，需入锅煮炼。匠人将麻线投入沸水中，加入草木灰一同熬煮。水汽氤氲中，麻线中的胶质渐渐溶解，杂质被去除，线质变得更加柔软洁白。煮麻的火候与时间全凭经验，煮过头则线质受损，煮不够则胶质残留。煮好的麻线捞出晾凉，便如丝般柔顺。'
                },
                {
                    name: '排线上机',
                    file: '模型五图片/排线上机.png',
                    fullscreenFile: '模型五全屏展示/排线上机.png',
                    subtitle: '穿综引筘，经纬分明',
                    desc: '织布之前，需将经线一根一根地排上织机。匠人将麻线作为经线，按照布匹的宽度与密度，仔细地穿过综丝与筘齿。这是最考验耐心的工序，数百根经线需排列均匀、松紧一致，一根错乱便会影响整匹布的质量。排线完毕，匠人还要将火草绒线绕成纬线梭子，为接下来的纺织做好准备。'
                },
                {
                    name: '纺织',
                    file: '模型五图片/纺织.png',
                    fullscreenFile: '模型五全屏展示/纺织.png',
                    subtitle: '经纬交织，布匹渐成',
                    desc: '织机声声，梭子如飞。匠人端坐于织机前，双手交替投梭，脚踏踏板，经线在综丝的带动下交错开合，纬线被梭子带着穿梭其间。经纬交织，一梭一梭，布匹在指尖缓缓生长。纺织是时间的艺术，每一寸布都凝聚着匠人的专注与节奏。火草绒线为纬，麻线为经，织出的布匹既柔软又结实，是自然与智慧的完美结合。'
                },
                {
                    name: '成布',
                    file: '模型五图片/成布.png',
                    fullscreenFile: '模型五全屏展示/成布.png',
                    subtitle: '布成匹落，华章终成',
                    desc: '最后一梭落下，织机停歇。匠人用剪刀剪断经线，将织好的布匹从织机上取下。布匹展开，火草绒的银白与麻线的素净交织出独特的纹理，手感温润，光泽内敛。匠人抚摸着布面，每一寸都承载着从采草到成布的漫长旅程。成布不是终点，而是新的开始——这匹布将在匠人手中，或被制成衣裳，或被裁为锦被，继续书写属于它的故事。'
                }
            ];

            function loadImage(index) {
                processImage.classList.remove('visible');
                if (imagePlaceholder) {
                    imagePlaceholder.style.display = 'flex';
                }

                var img = new Image();
                img.onload = function() {
                    processImage.src = steps[index].file;
                    if (imagePlaceholder) {
                        imagePlaceholder.style.display = 'none';
                    }
                    processImage.classList.add('visible');
                };
                img.onerror = function() {
                    processImage.classList.remove('visible');
                    if (imagePlaceholder) {
                        imagePlaceholder.style.display = 'flex';
                    }
                };
                img.src = steps[index].file;
            }

            function showDetail(index) {
                if (isAnimating) return;
                isAnimating = true;

                currentIndex = index;

                stepLabel.textContent = steps[index].name;
                detailTitle.textContent = steps[index].name;
                detailSubtitle.textContent = steps[index].subtitle || '';
                detailDesc.innerHTML = steps[index].desc;
                detailStepNum.textContent = '第' + chineseNums[index] + '步';

                updateNavButtons();

                tocView.classList.add('hidden');
                detailView.classList.add('visible');

                loadImage(index);

                setTimeout(function() {
                    isAnimating = false;
                }, 450);
            }

            function showToc() {
                if (isAnimating) return;
                isAnimating = true;

                detailView.classList.remove('visible');
                tocView.classList.remove('hidden');

                setTimeout(function() {
                    isAnimating = false;
                }, 450);
            }

            function updateNavButtons() {
                if (currentIndex <= 0) {
                    prevBtn.classList.add('disabled');
                } else {
                    prevBtn.classList.remove('disabled');
                }
                if (currentIndex >= steps.length - 1) {
                    nextBtn.classList.add('disabled');
                } else {
                    nextBtn.classList.remove('disabled');
                }
            }

            function goToPrev() {
                if (currentIndex > 0 && !isAnimating) {
                    showDetail(currentIndex - 1);
                }
            }

            function goToNext() {
                if (currentIndex < steps.length - 1 && !isAnimating) {
                    showDetail(currentIndex + 1);
                }
            }

            for (var i = 0; i < tocItems.length; i++) {
                (function(idx) {
                    tocItems[idx].addEventListener('click', function() {
                        showDetail(idx);
                    });
                })(i);
            }

            detailBack.addEventListener('click', showToc);
            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    goToPrev();
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    goToNext();
                } else if (e.key === 'Escape') {
                    if (detailView.classList.contains('visible')) {
                        showToc();
                    } else if (fullscreenOverlay.classList.contains('visible')) {
                        closeFullscreen();
                    }
                }
            });

            var fullscreenOverlay = document.getElementById('fullscreenOverlay');
            var fullscreenImage = document.getElementById('fullscreenImage');
            var fullscreenLabel = document.getElementById('fullscreenLabel');
            var fullscreenBtn = document.getElementById('fullscreenBtn');
            var fullscreenClose = document.getElementById('fullscreenClose');
            var fullscreenPrev = document.getElementById('fullscreenPrev');
            var fullscreenNext = document.getElementById('fullscreenNext');
            var fullscreenCurrentIndex = 0;

            function openFullscreen(index) {
                fullscreenCurrentIndex = index !== undefined ? index : currentIndex;
                fullscreenLabel.textContent = steps[fullscreenCurrentIndex].name;
                fullscreenImage.classList.remove('visible');

                var img = new Image();
                img.onload = function() {
                    fullscreenImage.src = steps[fullscreenCurrentIndex].fullscreenFile || steps[fullscreenCurrentIndex].file;
                    fullscreenImage.classList.add('visible');
                };
                img.onerror = function() {
                    fullscreenImage.src = steps[fullscreenCurrentIndex].file;
                    fullscreenImage.classList.add('visible');
                };
                img.src = steps[fullscreenCurrentIndex].fullscreenFile || steps[fullscreenCurrentIndex].file;

                fullscreenOverlay.classList.add('visible');
                updateFullscreenNav();
            }

            function closeFullscreen() {
                fullscreenOverlay.classList.remove('visible');
            }

            function updateFullscreenNav() {
                if (fullscreenCurrentIndex <= 0) {
                    fullscreenPrev.classList.add('disabled');
                } else {
                    fullscreenPrev.classList.remove('disabled');
                }
                if (fullscreenCurrentIndex >= steps.length - 1) {
                    fullscreenNext.classList.add('disabled');
                } else {
                    fullscreenNext.classList.remove('disabled');
                }
            }

            function fullscreenGoPrev() {
                if (fullscreenCurrentIndex > 0) {
                    openFullscreen(fullscreenCurrentIndex - 1);
                }
            }

            function fullscreenGoNext() {
                if (fullscreenCurrentIndex < steps.length - 1) {
                    openFullscreen(fullscreenCurrentIndex + 1);
                }
            }

            fullscreenBtn.addEventListener('click', function() {
                openFullscreen(currentIndex);
            });

            fullscreenClose.addEventListener('click', closeFullscreen);
            fullscreenPrev.addEventListener('click', fullscreenGoPrev);
            fullscreenNext.addEventListener('click', fullscreenGoNext);

            fullscreenOverlay.addEventListener('click', function(e) {
                if (e.target === fullscreenOverlay) {
                    closeFullscreen();
                }
            });

            loadImage(0);
        })();
    </script>
</body>
</html>
