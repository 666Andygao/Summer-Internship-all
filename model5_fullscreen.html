<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火草纺织工艺 · 双模型展示</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(160deg, #fff1f2 0%, #fecdd3 30%, #fda4af 70%, #fb7185 100%);
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 2px solid rgba(225, 29, 72, 0.15);
            box-shadow: 0 4px 20px rgba(225, 29, 72, 0.1);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(225, 29, 72, 0.5);
        }

        .title-text {
            font-size: 1.3em;
            color: #be123c;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .page-indicator {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .page-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(225, 29, 72, 0.25);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .page-dot.active {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            transform: scale(1.25);
            box-shadow: 0 4px 16px rgba(225, 29, 72, 0.45);
            border-color: rgba(254, 205, 211, 0.6);
        }

        .page-dot:hover:not(.active) {
            background: rgba(225, 29, 72, 0.45);
            transform: scale(1.15);
        }

        .scroll-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .page-section {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-canvas-wrapper {
            width: 85%;
            height: 85vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 20px;
            box-shadow: 0 12px 48px rgba(225, 29, 72, 0.25);
        }

        .page-label {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 1.05em;
            color: #be123c;
            font-weight: 700;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(225, 29, 72, 0.2);
            box-shadow: 0 6px 24px rgba(225, 29, 72, 0.18);
            z-index: 50;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .scroll-hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 32px;
            border-radius: 28px;
            font-size: 0.92em;
            color: #be123c;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(225, 29, 72, 0.2);
            box-shadow: 0 4px 20px rgba(225, 29, 72, 0.15);
            z-index: 60;
            animation: bounce 2s infinite;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-8px); }
            60% { transform: translateX(-50%) translateY(-4px); }
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.98);
            z-index: 200;
            transition: opacity 0.6s ease;
            border-radius: 20px;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(225, 29, 72, 0.15);
            border-top-color: #e11d48;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 18px;
            color: #be123c;
            font-size: 1em;
            font-weight: 600;
        }

        .controls-panel {
            position: fixed;
            bottom: 110px;
            right: 45px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 55;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #e11d48;
            box-shadow: 0 4px 16px rgba(225, 29, 72, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.15);
            background: #fff;
            box-shadow: 0 6px 24px rgba(225, 29, 72, 0.45);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="model5.html" class="back-button">← 返回详情页</a>
        <div class="title-text">🧵 火草纺织工艺 · 双模型展示</div>
        <div class="page-indicator">
            <div class="page-dot active" data-page="0" title="火草布卷"></div>
            <div class="page-dot" data-page="1" title="火草衣物"></div>
        </div>
    </div>

    <div class="scroll-container" id="scrollContainer">

        <div class="page-section" data-page="0">
            <div class="model-canvas-wrapper">
                <canvas id="canvas_page0" class="model-canvas"></canvas>

                <div class="loading-overlay" id="loading_page0">
                    <div class="spinner"></div>
                    <div class="loading-text">正在加载火草布卷模型...</div>
                </div>
            </div>
            <div class="page-label">🧵 第1页 · 火草纺织布卷</div>
        </div>

        <div class="page-section" data-page="1">
            <div class="model-canvas-wrapper">
                <canvas id="canvas_page1" class="model-canvas"></canvas>

                <div class="loading-overlay" id="loading_page1">
                    <div class="spinner"></div>
                    <div class="loading-text">正在加载火草衣物模型...</div>
                </div>
            </div>
            <div class="page-label">👗 第2页 · 火草纺织衣物</div>
        </div>

    </div>

    <div class="scroll-hint" id="scrollHint">⬇️ 滚动鼠标查看下一个模型</div>

    <div class="controls-panel">
        <button class="control-btn" id="zoomInBtn" title="放大">+</button>
        <button class="control-btn" id="zoomOutBtn" title="缩小">−</button>
        <button class="control-btn" id="resetBtn" title="重置视角">⟳</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        const scrollContainer = document.getElementById('scrollContainer');
        const pageDots = document.querySelectorAll('.page-dot');
        const scrollHint = document.getElementById('scrollHint');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetBtn = document.getElementById('resetBtn');

        let currentPage = 0;
        const totalPages = 2;

        const scenes = [];
        const cameras = [];
        const renderers = [];
        const controlsList = [];

        const modelConfigs = [
            {
                title: '火草纺织布卷',
                mtlPath: encodeURI('模型五模型/fabric roll 3d model/fabric+roll+3d+model.mtl'),
                objPath: encodeURI('模型五模型/fabric roll 3d model/fabric+roll+3d+model.obj'),
                loadingText: '正在加载火草布卷模型...'
            },
            {
                title: '火草纺织衣物',
                mtlPath: encodeURI('模型五模型/traditional dress 3d model/traditional+dress+3d+model.mtl'),
                objPath: encodeURI('模型五模型/traditional dress 3d model/traditional+dress+3d+model.obj'),
                loadingText: '正在加载火草衣物模型...'
            }
        ];

        function initScene(pageIndex) {
            const canvas = document.getElementById(`canvas_page${pageIndex}`);
            
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfff5f7);

            const aspect = canvas.clientWidth / canvas.clientHeight;
            const camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
            camera.position.set(6, 3, 6);

            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;

            const ambientLight = new THREE.AmbientLight(0xfff5e0, 1.8);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 4.5);
            keyLight.position.set(6, 10, 6);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 50;
            keyLight.shadow.camera.left = -10;
            keyLight.shadow.camera.right = 10;
            keyLight.shadow.camera.top = 10;
            keyLight.shadow.camera.bottom = -10;
            keyLight.shadow.bias = -0.0001;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffe0b0, 2.5);
            fillLight.position.set(-4, 3, -4);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 2);
            rimLight.position.set(0, 2, -6);
            scene.add(rimLight);

            const groundGeometry = new THREE.PlaneGeometry(25, 25);
            const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.25 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2.2;
            ground.receiveShadow = true;
            scene.add(ground);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.3, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 2;
            controls.maxDistance = 18;
            controls.maxPolarAngle = Math.PI * 0.75;
            controls.minPolarAngle = 0.2;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6;

            scenes.push(scene);
            cameras.push(camera);
            renderers.push(renderer);
            controlsList.push(controls);

            loadModel(pageIndex);
        }

        function loadModel(pageIndex) {
            const config = modelConfigs[pageIndex];
            const scene = scenes[pageIndex];
            const loadingOverlay = document.getElementById(`loading_page${pageIndex}`);
            const textEl = loadingOverlay.querySelector('.loading-text');

            textEl.textContent = config.loadingText;
            loadingOverlay.classList.remove('hidden');

            const mtlLoader = new MTLLoader();
            const objLoader = new OBJLoader();

            mtlLoader.load(config.mtlPath, (materials) => {
                materials.preload();
                objLoader.setMaterials(materials);

                objLoader.load(config.objPath,
                    (object) => {
                        console.log(`${config.title}模型加载成功`);

                        object.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        const box = new THREE.Box3().setFromObject(object);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 5 / maxDim;
                        object.scale.multiplyScalar(scale);

                        box.setFromObject(object);
                        const center = box.getCenter(new THREE.Vector3());
                        object.position.sub(center);

                        scene.add(object);

                        setTimeout(() => {
                            loadingOverlay.classList.add('hidden');
                        }, 800);
                    },
                    (xhr) => {
                        if (xhr.lengthComputable) {
                            const percent = Math.round((xhr.loaded / xhr.total) * 100);
                            const loadedMB = (xhr.loaded / 1024 / 1024).toFixed(2);
                            const totalMB = (xhr.total / 1024 / 1024).toFixed(2);
                            textEl.textContent = `${config.loadingText} ${percent}% (${loadedMB}MB / ${totalMB}MB)`;
                        }
                    },
                    (error) => {
                        console.error(`${config.title}模型加载错误:`, error);
                        textEl.innerHTML = '⚠️ 模型加载失败<br><span style="font-size: 0.88em; color: #666; margin-top: 8px; display: block;">请检查文件路径或返回重试</span>';
                        loadingOverlay.querySelector('.spinner').style.borderTopColor = '#e53935';
                    }
                );
            }, undefined, () => {
                objLoader.load(config.objPath,
                    (object) => {
                        console.log(`${config.title}模型加载成功（无材质）`);

                        object.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                child.material = new THREE.MeshStandardMaterial({
                                    color: 0xf5deb3,
                                    roughness: 0.8,
                                    metalness: 0.05
                                });
                            }
                        });

                        const box = new THREE.Box3().setFromObject(object);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 5 / maxDim;
                        object.scale.multiplyScalar(scale);

                        box.setFromObject(object);
                        const center = box.getCenter(new THREE.Vector3());
                        object.position.sub(center);

                        scene.add(object);

                        setTimeout(() => {
                            loadingOverlay.classList.add('hidden');
                        }, 800);
                    },
                    (xhr) => {
                        if (xhr.lengthComputable) {
                            const percent = Math.round((xhr.loaded / xhr.total) * 100);
                            const loadedMB = (xhr.loaded / 1024 / 1024).toFixed(2);
                            const totalMB = (xhr.total / 1024 / 1024).toFixed(2);
                            textEl.textContent = `${config.loadingText} ${percent}% (${loadedMB}MB / ${totalMB}MB)`;
                        }
                    },
                    (error) => {
                        console.error(`${config.title}模型加载完全失败:`, error);
                        textEl.innerHTML = '⚠️ 模型加载失败<br><span style="font-size: 0.88em; color: #666; margin-top: 8px; display: block;">请检查文件路径或返回重试</span>';
                        loadingOverlay.querySelector('.spinner').style.borderTopColor = '#e53935';
                    }
                );
            });
        }

        function updatePageIndicator() {
            pageDots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPage);
            });

            if (currentPage === totalPages - 1) {
                scrollHint.style.opacity = '0';
                scrollHint.style.pointerEvents = 'none';
            } else {
                scrollHint.style.opacity = '1';
                scrollHint.style.pointerEvents = 'auto';
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            for (let i = 0; i < totalPages; i++) {
                if (renderers[i] && scenes[i] && cameras[i] && controlsList[i]) {
                    controlsList[i].update();
                    renderers[i].render(scenes[i], cameras[i]);
                }
            }
        }

        scrollContainer.addEventListener('scroll', () => {
            const scrollTop = scrollContainer.scrollTop;
            const viewportHeight = window.innerHeight;
            currentPage = Math.round(scrollTop / viewportHeight);
            currentPage = Math.max(0, Math.min(currentPage, totalPages - 1));
            updatePageIndicator();
        });

        pageDots.forEach(dot => {
            dot.addEventListener('click', () => {
                const targetPage = parseInt(dot.dataset.page);
                const targetPosition = targetPage * window.innerHeight;
                
                scrollContainer.scrollTo({
                    top: targetPosition,
                    behavior: 'smooth'
                });

                currentPage = targetPage;
                updatePageIndicator();
            });
        });

        zoomInBtn.addEventListener('click', () => {
            if (cameras[currentPage] && controlsList[currentPage]) {
                const camera = cameras[currentPage];
                const controls = controlsList[currentPage];
                const direction = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
                const distance = camera.position.distanceTo(controls.target);
                const newDistance = Math.max(distance * 0.75, controls.minDistance);
                camera.position.copy(controls.target).add(direction.multiplyScalar(newDistance));
                controls.update();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (cameras[currentPage] && controlsList[currentPage]) {
                const camera = cameras[currentPage];
                const controls = controlsList[currentPage];
                const direction = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
                const distance = camera.position.distanceTo(controls.target);
                const newDistance = Math.min(distance * 1.3, controls.maxDistance);
                camera.position.copy(controls.target).add(direction.multiplyScalar(newDistance));
                controls.update();
            }
        });

        resetBtn.addEventListener('click', () => {
            if (cameras[currentPage] && controlsList[currentPage]) {
                const camera = cameras[currentPage];
                const controls = controlsList[currentPage];
                camera.position.set(6, 3, 6);
                controls.target.set(0, 0.3, 0);
                controls.update();
            }
        });

        window.addEventListener('resize', () => {
            for (let i = 0; i < totalPages; i++) {
                const canvas = document.getElementById(`canvas_page${i}`);
                if (!canvas || !cameras[i] || !renderers[i]) continue;

                const container = canvas.parentElement;
                const width = container.clientWidth;
                const height = container.clientHeight;

                if (width <= 0 || height <= 0) continue;

                cameras[i].aspect = width / height;
                cameras[i].updateProjectionMatrix();
                renderers[i].setSize(width, height, false);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = 'model5.html';
            } else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                e.preventDefault();
                if (currentPage < totalPages - 1) {
                    const nextPosition = (currentPage + 1) * window.innerHeight;
                    scrollContainer.scrollTo({
                        top: nextPosition,
                        behavior: 'smooth'
                    });
                }
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                if (currentPage > 0) {
                    const prevPosition = (currentPage - 1) * window.innerHeight;
                    scrollContainer.scrollTo({
                        top: prevPosition,
                        behavior: 'smooth'
                    });
                }
            }
        });

        for (let i = 0; i < totalPages; i++) {
            initScene(i);
        }

        updatePageIndicator();
        animate();
    </script>
</body>
</html>
