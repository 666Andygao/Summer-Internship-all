<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型二 - 详细展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(160deg, #f5f0ff 0%, #e8dcf8 30%, #d1c4e9 70%, #b39ddb 100%);
            min-height: 100vh;
            color: #3e3550;
            overflow: hidden;
        }
        
        .page-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .model-display-section {
            height: calc(100vh * 2 / 3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            perspective: 1200px;
        }
        
        .model-carousel {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .carousel-item {
            position: absolute;
            width: 60%;
            height: 80%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(237, 231, 246, 0.95) 100%);
            border-radius: 25px;
            border: 1px solid rgba(126, 87, 194, 0.2);
            box-shadow: 0 20px 60px rgba(126, 87, 194, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
        }
        
        .carousel-item.active {
            transform: translateX(0) translateZ(0) scale(1);
            opacity: 1;
            z-index: 3;
            border-color: rgba(126, 87, 194, 0.7);
            box-shadow: 0 20px 60px rgba(126, 87, 194, 0.15), 0 0 60px rgba(126, 87, 194, 0.3);
        }
        
        .carousel-item.left {
            transform: translateX(-35%) translateZ(-100px) scale(0.75);
            opacity: 0.4;
            z-index: 2;
            filter: blur(2px);
        }
        
        .carousel-item.right {
            transform: translateX(35%) translateZ(-100px) scale(0.75);
            opacity: 0.4;
            z-index: 2;
            filter: blur(2px);
        }
        
        .carousel-item:hover {
            opacity: 0.6;
        }
        
        .carousel-item.active:hover {
            opacity: 1;
        }
        
        .carousel-item-visual {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, #d1c4e9 0%, #b39ddb 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8em;
            color: rgba(81, 45, 109, 0.25);
            border: 3px dashed rgba(126, 87, 194, 0.4);
        }
        
        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 4;
        }
        
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(126, 87, 194, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: #7e57c2;
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(126, 87, 194, 0.6);
        }
        
        .text-section {
            height: calc(100vh * 1 / 3);
            background: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(126, 87, 194, 0.15);
            padding: 30px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .text-content h2 {
            font-size: 2.2em;
            color: #512da8;
            margin-bottom: 15px;
        }
        
        .text-content p {
            color: #6a5a7a;
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .arrow-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(126, 87, 194, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
        }
        
        .arrow-nav:hover {
            background: rgba(126, 87, 194, 1);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 20px rgba(126, 87, 194, 0.6);
        }
        
        .arrow-nav.prev {
            left: 30px;
        }
        
        .arrow-nav.next {
            right: 30px;
        }
        
        .arrow {
            border: solid #fff;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 4px;
        }
        
        .left-arrow {
            transform: rotate(135deg);
        }
        
        .right-arrow {
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="model-display-section">
            <div class="model-carousel" id="modelCarousel">
                <div class="arrow-nav prev" onclick="previousModel()">
                    <i class="arrow left-arrow"></i>
                </div>
                <div class="arrow-nav next" onclick="nextModel()">
                    <i class="arrow right-arrow"></i>
                </div>
                
                <div class="carousel-item active" data-index="0">
                    <div class="carousel-item-visual">2A</div>
                </div>
                <div class="carousel-item left" data-index="1">
                    <div class="carousel-item-visual">2B</div>
                </div>
                <div class="carousel-item right" data-index="2">
                    <div class="carousel-item-visual">2C</div>
                </div>
                
                <div class="indicators">
                    <div class="indicator active" data-index="0" onclick="goToModel(0)"></div>
                    <div class="indicator" data-index="1" onclick="goToModel(1)"></div>
                    <div class="indicator" data-index="2" onclick="goToModel(2)"></div>
                </div>
            </div>
        </div>
        
        <div class="text-section">
            <div class="text-content" id="textContent">
                <h2 id="modelTitle">模型二 - A版本</h2>
                <p id="modelDescription">这是模型二的第一个子模型，采用先进的算法和技术架构。该版本专注于高效的数据处理流程，提供卓越的计算性能和资源利用率，适合大规模数据处理场景。</p>
                <p>支持分布式计算，具备自动负载均衡能力，可在集群环境中无缝扩展。</p>
            </div>
        </div>
    </div>

    <script>
        const modelsData = [
            {
                title: "模型二 - A版本",
                description: "这是模型二的第一个子模型，采用先进的算法和技术架构。该版本专注于高效的数据处理流程，提供卓越的计算性能和资源利用率，适合大规模数据处理场景。",
                extra: "支持分布式计算，具备自动负载均衡能力，可在集群环境中无缝扩展。"
            },
            {
                title: "模型二 - B版本",
                description: "这是模型二的第二个子模型，在A版本基础上增强了实时处理能力。引入了流式数据处理框架，支持低延迟、高吞吐量的数据管道，满足实时业务需求。",
                extra: "内置容错机制和自动恢复功能，确保数据处理的稳定性和可靠性，支持7×24小时不间断运行。"
            },
            {
                title: "模型二 - C版本",
                description: "这是模型二的第三个子模型，融合了边缘计算和云计算的双重优势。通过智能任务调度，在保证处理速度的同时最小化网络传输开销，适合混合部署环境。",
                extra: "支持自适应资源分配，根据负载动态调整计算资源，实现成本效益最大化。"
            }
        ];
        
        let currentIndex = 0;
        let isAnimating = false;
        
        function updateCarousel() {
            const items = document.querySelectorAll('.carousel-item');
            const indicators = document.querySelectorAll('.indicator');
            
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.className = 'carousel-item active';
                } else if (index === (currentIndex - 1 + 3) % 3) {
                    item.className = 'carousel-item left';
                } else if (index === (currentIndex + 1) % 3) {
                    item.className = 'carousel-item right';
                } else {
                    item.className = 'carousel-item left';
                }
            });
            
            indicators.forEach((indicator, index) => {
                if (index === currentIndex) {
                    indicator.className = 'indicator active';
                } else {
                    indicator.className = 'indicator';
                }
            });
            
            const data = modelsData[currentIndex];
            document.getElementById('modelTitle').textContent = data.title;
            document.getElementById('modelDescription').textContent = data.description;
            document.querySelector('#textContent p:last-child').textContent = data.extra;
        }
        
        function nextModel() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex = (currentIndex + 1) % 3;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        function previousModel() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex = (currentIndex - 1 + 3) % 3;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        function goToModel(index) {
            if (isAnimating || index === currentIndex) return;
            isAnimating = true;
            currentIndex = index;
            updateCarousel();
            setTimeout(() => { isAnimating = false; }, 600);
        }
        
        document.querySelectorAll('.carousel-item').forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.dataset.index);
                if (index !== currentIndex) {
                    goToModel(index);
                }
            });
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousModel();
            if (e.key === 'ArrowRight') nextModel();
        });
    </script>
</body>
</html>
