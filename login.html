<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 华夏风物 · 非遗传承</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f2ebe4 0%, #e8d5c4 50%, #f5f2ef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #2f4f4f 0%, #243f3f 100%);
            color: white;
            padding: 36px 36px 28px;
            text-align: center;
        }

        .login-header .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        .login-body {
            padding: 32px 36px 36px;
        }

        .role-tabs {
            display: flex;
            background: #f5f2ef;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
            gap: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: transparent;
            color: #7a6b61;
            text-align: center;
        }

        .role-tab.active {
            background: white;
            color: #2f4f4f;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .role-tab:hover:not(.active) {
            color: #4d3e36;
        }

        .role-tab .role-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4d3e36;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: 2px solid #e0d8d1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #faf8f6;
            color: #1a1a1a;
            outline: none;
        }

        .input-wrap input:focus {
            border-color: #2f4f4f;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(47, 79, 79, 0.08);
        }

        .eye-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn:hover {
            color: #2f4f4f;
            background: #f0ebe3;
        }

        .strength-wrap {
            margin-top: 8px;
            padding: 0 2px;
        }

        .strength-wrap .bar {
            display: flex;
            gap: 4px;
            height: 4px;
        }

        .strength-wrap .bar span {
            flex: 1;
            background: #e0d8d1;
            border-radius: 2px;
            transition: background 0.3s;
        }

        .strength-wrap .bar span.on-1 { background: #dc2626; }
        .strength-wrap .bar span.on-2 { background: #f59e0b; }
        .strength-wrap .bar span.on-3 { background: #22c55e; }
        .strength-wrap .bar span.on-4 { background: #16a34a; }

        .strength-wrap .label {
            font-size: 12px;
            color: #6b6255;
            margin-top: 4px;
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6b6255;
            cursor: pointer;
            line-height: 1.5;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
            accent-color: #2f4f4f;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #2f4f4f;
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2f4f4f 0%, #243f3f 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(47, 79, 79, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7a6b61;
        }

        .switch-mode a {
            color: #2f4f4f;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #fecaca;
        }

        .error-msg.show { display: block; }

        .success-msg {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #bbf7d0;
        }

        .success-msg.show { display: block; }

        .field-hint {
            font-size: 12px;
            color: #9a8f7e;
            margin-top: 4px;
            padding-left: 2px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #7a6b61;
            text-decoration: none;
        }

        .back-home:hover { color: #2f4f4f; }
    </style>
</head>
<body>
    <div id="protocolWarning" style="display:none; position:fixed; top:0; left:0; right:0; background:#fff3cd; color:#856404; padding:14px 20px; text-align:center; z-index:9999; font-size:14px; border-bottom:2px solid #ffc107;">
        请使用 <b>http://localhost:3000/login.html</b> 访问，而不是直接双击打开文件！
    </div>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">华夏风物</div>
            <div class="subtitle">非遗传承 · 数字平台</div>
        </div>
        <div class="login-body">
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>

            <div class="role-tabs" id="roleTabs">
                <button class="role-tab active" data-role="user">
                    <span class="role-icon">👤</span> 用户
                </button>
                <button class="role-tab" data-role="developer">
                    <span class="role-icon">👨‍💻</span> 开发者
                </button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrap">
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrap">
                        <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
                        <button type="button" class="eye-btn" id="toggleLoginPwd" title="显示/隐藏密码">👁</button>
                    </div>
                </div>
                <input type="hidden" id="loginRole" value="user">
                <button type="submit" class="submit-btn">登 录</button>
            </form>

            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>显示名称</label>
                    <div class="input-wrap">
                        <input type="text" id="regDisplayName" placeholder="您的昵称或艺名" required maxlength="30">
                    </div>
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrap">
                        <input type="text" id="regUsername" placeholder="3-20 位字母/数字/下划线" required autocomplete="username" pattern="[A-Za-z0-9_]{3,20}">
                    </div>
                    <div class="field-hint">3-20 位，只能包含字母、数字和下划线</div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrap">
                        <input type="password" id="regPassword" placeholder="至少 6 位，建议混合大小写和数字" required minlength="6" autocomplete="new-password">
                        <button type="button" class="eye-btn" id="toggleRegPwd" title="显示/隐藏密码">👁</button>
                    </div>
                    <div class="strength-wrap" id="pwdStrength" style="display:none;">
                        <div class="bar"><span></span><span></span><span></span><span></span></div>
                        <span class="label"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <div class="input-wrap">
                        <input type="password" id="regConfirmPassword" placeholder="请再次输入密码" required autocomplete="new-password">
                        <button type="button" class="eye-btn" id="toggleConfirmPwd" title="显示/隐藏密码">👁</button>
                    </div>
                </div>
                <input type="hidden" id="regRole" value="user">
                <label class="checkbox-group">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>我已阅读并同意 <a href="#" onclick="alert('用户协议详情页');return false;">《用户协议》</a> 和 <a href="#" onclick="alert('隐私政策详情页');return false;">《隐私政策》</a></span>
                </label>
                <button type="submit" class="submit-btn" id="registerBtn">注 册</button>
            </form>

            <div class="switch-mode">
                <span id="switchText">还没有账号？</span>
                <a id="switchLink" onclick="toggleMode()">立即注册</a>
            </div>

            <a href="MainPage.html" class="back-home">← 返回首页</a>
        </div>
    </div>

    <script>
        if (window.location.protocol === 'file:') {
            document.getElementById('protocolWarning').style.display = 'block';
        }

        const API = '/api';
        let isLoginMode = true;
        let selectedRole = 'user';

        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                selectedRole = tab.dataset.role;
                document.getElementById('loginRole').value = selectedRole;
                document.getElementById('regRole').value = selectedRole;
            });
        });

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('loginForm').style.display = isLoginMode ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('switchText').textContent = isLoginMode ? '还没有账号？' : '已有账号？';
            document.getElementById('switchLink').textContent = isLoginMode ? '立即注册' : '立即登录';
            hideMessages();
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        function saveAuth(data) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
        }

        function getRedirect() {
            try {
                const r = new URLSearchParams(window.location.search).get('redirect');
                if (r && r.startsWith('/')) return r;
            } catch (e) {}
            return null;
        }

        function successDestination(user) {
            const redirect = getRedirect();
            if (redirect) return redirect;
            return user.role === 'user' ? 'user-dashboard.html' : 'developer-dashboard.html';
        }

        function bindEyeToggle(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const input = document.getElementById(inputId);
                input.type = input.type === 'password' ? 'text' : 'password';
            });
        }
        bindEyeToggle('toggleLoginPwd', 'loginPassword');
        bindEyeToggle('toggleRegPwd', 'regPassword');
        bindEyeToggle('toggleConfirmPwd', 'regConfirmPassword');

        const STRENGTH_LABELS = ['', '弱', '中等', '强', '很强'];
        function checkPasswordStrength(pwd) {
            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 10) score++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;
            return Math.min(score, 4);
        }

        const strengthEl = document.getElementById('pwdStrength');
        const strengthBars = strengthEl.querySelectorAll('.bar span');
        const strengthLabel = strengthEl.querySelector('.label');

        document.getElementById('regPassword').addEventListener('input', (e) => {
            const pwd = e.target.value;
            if (pwd.length === 0) {
                strengthEl.style.display = 'none';
                return;
            }
            strengthEl.style.display = 'block';
            const score = checkPasswordStrength(pwd);
            strengthBars.forEach((bar, i) => {
                bar.className = i < score ? 'on-' + score : '';
            });
            strengthLabel.textContent = STRENGTH_LABELS[score] || '';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const role = selectedRole;

            if (!username || !password) {
                return showError('请填写用户名和密码');
            }

            try {
                const res = await fetch(API + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                const data = await res.json();

                if (!res.ok) {
                    return showError(data.error || '登录失败');
                }

                saveAuth(data);
                showSuccess('登录成功！正在跳转...');

                setTimeout(() => {
                    window.location.href = successDestination(data.user);
                }, 800);
            } catch (err) {
                showError('网络错误，请检查服务器是否启动');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const display_name = document.getElementById('regDisplayName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const role = selectedRole;
            const agree = document.getElementById('agreeTerms').checked;

            if (!display_name) return showError('请填写显示名称');
            if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return showError('用户名须为 3–20 位字母、数字或下划线');
            if (password.length < 6) return showError('密码至少 6 位');
            if (password !== confirm) return showError('两次输入的密码不一致');
            if (!agree) return showError('请先同意用户协议和隐私政策');

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const res = await fetch(API + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role, display_name })
                });
                const data = await res.json();

                if (!res.ok) {
                    return showError(data.error || '注册失败');
                }

                saveAuth(data);
                showSuccess('注册成功！正在跳转...');

                setTimeout(() => {
                    window.location.href = successDestination(data.user);
                }, 800);
            } catch (err) {
                showError('网络错误，请检查服务器是否启动');
            } finally {
                btn.disabled = false;
                btn.textContent = '注 册';
            }
        });
    </script>
</body>
</html>
